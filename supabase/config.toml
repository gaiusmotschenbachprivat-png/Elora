# Ausschnitt der Supabase-Projektkonfiguration (supabase CLI)
# Der Stripe-Webhook wird von Stripe ohne Supabase-JWT aufgerufen und prüft
# stattdessen die Stripe-Signatur selbst.
[functions.stripe-webhook]
verify_jwt = false

[functions.launch-signup]
verify_jwt = true

[functions.checkout]
verify_jwt = true

[functions.order-status]
verify_jwt = true
